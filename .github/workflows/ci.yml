name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run check
      - run: bun run check:release
      # Version gate (issue #424): fetch the base ref it compares against.
      # `|| true` keeps the fetch soft; the gate itself reds when origin/main
      # truly cannot be resolved.
      - run: git fetch origin main --depth=1 || true
      - run: bun run check:version
      - run: bun run check:docs
      # Index-projection gate (issue #474): a resolved rebase that left conflict
      # markers staged passed every other gate here green.
      - run: bun run check:conflict-markers
      - run: bun test
      - run: bun run smoke:artifact
      # The pre-merge review-stamp gate (issue #295), deliberately LAST: it
      # certifies the tree the other steps just verified.
      #
      # Keep GitHub's DEFAULT checkout -- no ref pin. On a pull_request,
      # actions/checkout checks out refs/pull/N/merge when the PR is mergeable,
      # so the digest verified is THE TREE THAT WOULD LAND -- the strongest form
      # of the gate and exactly the #377 failure class (a rebase-merge landing a
      # tree nobody reviewed). Intended consequences: a rebase after review
      # without a fresh re-review is red; a rebase followed by a re-review
      # passes (the fresh stamp digests the new tree); a stamp taken on a
      # branch tip that no longer matches after main moved reds. A conflicting
      # PR creates no merge ref and reds at checkout -- truthful, it cannot
      # land anyway. On push to main the newest stamp digests main's tree,
      # because every landing carries its own fresh stamp; a landing that
      # bypassed the gate turns main's CI red -- a signal, not a false alarm.
      #
      # Deliberately NOT an in-run gate (issue #271): DEFAULT_PROJECT_GATES
      # excludes `stamp:check` (pinned by test/pipeline-gates.test.ts) because
      # only runPipeline's settle path writes stamps. Nobody "fixes" this step
      # to a head-sha checkout without re-deciding the property above.
      # The normal stamp check is deliberately first. Only its failure pays the
      # full-history fallback cost: the fallback reads the stamp's parent and
      # merge-base, while these fetches leave the checked-out ref and tree alone.
      # Push checkouts install main under its explicit remote-tracking name;
      # PR checkouts retain the default merge ref and also install origin/main.
      - run: |
          if bun run stamp:check; then
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --unshallow origin "+refs/pull/${{ github.event.pull_request.number }}/merge:refs/remotes/pull/${{ github.event.pull_request.number }}/merge"
            git fetch origin "+refs/heads/main:refs/remotes/origin/main"
          elif [ "${{ github.event_name }}" = "push" ]; then
            git fetch --unshallow origin "+refs/heads/main:refs/remotes/origin/main"
          else
            echo "unsupported event for stamp history fallback: ${{ github.event_name }}" >&2
            exit 1
          fi

          bun run scripts/check-stamp-fixup.ts
