name: release
# Publishing happens here and nowhere else: from a tag, after the same gates a
# pull request passes, with no stored credential. npm authenticates the run
# itself through Trusted Publishing (issue #268) -- the repository holds no
# publish token, so there is none to leak.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # `id-token` is what lets GitHub attest this run to npm; `contents` is for
      # creating the release. Nothing else is granted.
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      # npm does the publishing (bun has no Trusted Publishing support), so a
      # node toolchain is set up even though the project runs on bun.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # The gates, in CI's order. A tag is not a promise that they passed: a tag
      # can be pushed at any commit, and a published version cannot be withdrawn
      # from npm -- only deprecated. So they run again here rather than trusting
      # that the branch was green.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run check
      - run: bun run check:release
      - run: bun run check:docs
      - run: bun test
      - run: bun run smoke:artifact

      # The tag must name the version being published. Without this, `v0.52.0`
      # on a tree that still says 0.51.0 publishes a duplicate and fails
      # confusingly, or -- worse -- silently ships something other than what the
      # tag says.
      - name: Tag matches package version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$packaged" ]; then
            echo "tag $GITHUB_REF_NAME names $tagged, package.json says $packaged" >&2
            exit 1
          fi

      # `npm publish` with no NODE_AUTH_TOKEN: the OIDC credential minted from
      # `id-token: write` is what npm verifies. npm 11.5.1+ is required for
      # Trusted Publishing.
      - run: npm install -g npm@latest
      - run: npm publish

      # The release notes are the CHANGELOG section for this version, so the
      # published notes and the committed history cannot drift apart.
      - name: Extract the changelog entry
        run: |
          awk -v ver="## [${GITHUB_REF_NAME#v}]" '
            index($0, ver) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "no CHANGELOG entry for $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
